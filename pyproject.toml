[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-kv"
version = "0.1.0"
description = "A Dynamo-style distributed key-value store"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "PyYAML>=6.0",
]

[project.scripts]
kv = "client.cli:main"

[tool.setuptools]
packages = ["dynamo", "client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
