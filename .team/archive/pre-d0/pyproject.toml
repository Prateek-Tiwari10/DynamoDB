[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-kv"
version = "0.1.0"
description = "Dynamo-style key-value store, Phase 1: single node"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.60"]

[project.scripts]
kv = "client.cli:main"

[tool.setuptools]
packages = ["dynamo", "client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
